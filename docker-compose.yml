name: rm-erp

services:
  rm-home-decor-app:
    build:
      context: ./RM-home-decor-app
      dockerfile: docker/PHP.Dockerfile
    working_dir: /var/www
    volumes:
      - ./RM-home-decor-app:/var/www
    environment:
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rm_erp}
      DB_USERNAME: ${DB_USERNAME:-rm_erp}
      DB_PASSWORD: ${DB_PASSWORD:-rm_erp_password}
    command: >
      sh -c "test -f vendor/autoload.php || composer install --no-interaction;
      php-fpm"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - rm-erp

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./RM-home-decor-app:/var/www:ro
      - ./RM-home-decor-app/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rm-home-decor-app
    networks:
      - rm-erp

  vite:
    build:
      context: ./RM-home-decor-app
      dockerfile: docker/Node.Dockerfile
    working_dir: /var/www
    volumes:
      - ./RM-home-decor-app:/var/www
      - node_modules:/var/www/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"
    command: >
      sh -c "npm install &&
      npm run dev -- --host 0.0.0.0"
    networks:
      - rm-erp

  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rm_erp}
      MYSQL_USER: ${DB_USERNAME:-rm_erp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rm_erp_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - rm-erp

networks:
  rm-erp:
    driver: bridge

volumes:
  mysql_data:
  node_modules:
